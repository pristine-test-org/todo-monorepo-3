<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jotter-lite - weekly digest</title>
    <style>
      body {
        margin: 0;
        background: #101211;
        color: #d9ddd8;
        font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 14px;
        line-height: 1.6;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 3rem 0 5rem;
      }
      .section {
        padding: 0 1.25rem;
      }
      /* Intentional, for Impeccable's test drive: gradient text on the heading. */
      h1 {
        margin: 0 0 1rem;
        font-size: 1.75rem;
        background: linear-gradient(90deg, #f2b33d, #ff7a66);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* Intentional, for Impeccable's test drive: a hard-coded colour that is not in DESIGN.md. */
      .badge {
        display: inline-block;
        padding: 0.1rem 0.5rem;
        border: 1px solid #3b82f6;
        color: #3b82f6;
      }
      /* Intentional, for Impeccable's test drive: low-contrast text in a solid dark grey. */
      .hint {
        color: #3a3f3c;
      }
      /* Intentional, for Impeccable's test drive: body text flush with the viewport edge, no background. */
      .edge {
        margin: 1.5rem 0;
        padding: 0;
      }
      /* Intentional, for Impeccable's test drive: a layout property in a transition. */
      .meter {
        width: 30%;
        height: 0.5rem;
        background: #f2b33d;
        transition: width 0.3s;
      }
      .meter:hover {
        width: 90%;
      }
      /* Intentional, for Impeccable's test drive: link text under the 11px floor. */
      .back {
        font-size: 10px;
        color: #f2b33d;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="section">
        <h1>weekly digest</h1>
        <p><span class="badge">beta</span> A short look at how your list moved this week.</p>
        <p class="hint">Counts refresh each time you open the list.</p>
        <div class="meter" role="img" aria-label="Share of items finished"></div>
      </div>
      <p class="edge">You finished more items than you added this week, so the list is shorter than it was on Monday.</p>
      <div class="section">
        <a class="back" href="/">back to the list</a>
      </div>
    </main>
  </body>
</html>
